<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="shortcut icon" href="/favicon.png?v=5" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Catch Me" />
    <!-- viewport-fit=cover / status-bar-style=black-translucent 를 쓰면 iOS가 화면을
         상태바 밑까지 넓혀버린다. 이 앱은 safe-area 여백을 전제로 만들어져 있지 않아서
         맨 위 헤더(설정·목록 버튼)가 시계에 가려 눌리지 않았다. 그래서 둘 다 쓰지 않는다. -->
    <!-- maximum-scale=1 · user-scalable=no: 더블탭·핀치·입력창 포커스 시 자동 확대를 막아
         네이티브 앱처럼 화면이 고정되게 한다 (좌우 스와이프·세로 스크롤은 그대로). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <meta name="description" content="Catch Me — 5년 뒤 목표하는 나와 카톡처럼 대화하세요." />
    <title>Catch Me — 5년 뒤의 나와 대화</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
